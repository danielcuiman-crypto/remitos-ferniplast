<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Remito de Transporte Interno · Ferniplast</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#14181b;
    --bg-2:#1c2226;
    --paper:#faf7f1;
    --paper-2:#f1ece1;
    --ink:#211d17;
    --muted:#8b8578;
    --line:#d8d2c4;
    --red:#cf2030;
    --red-dark:#9c1420;
    --green:#2f7a4d;
    --err:#b0261f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% -10%, #232b30 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:Arial, sans-serif;
    min-height:100vh;
    padding:40px 16px 80px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  .brandbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:22px;padding:0 4px;
  }
  .brandbar .tag{
    font-family:Arial, sans-serif;
    font-size:12px;letter-spacing:.04em;color:#8f978f;
  }
  .admin-link{
    background:none;border:none;color:#9aa0a3;font-family:Arial, sans-serif;
    font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;
    padding:4px 0;
  }
  .admin-link:hover{color:#fff;}

  .sheet{
    background:var(--paper);
    box-shadow:0 30px 70px rgba(0,0,0,.45), 0 2px 0 rgba(255,255,255,.03) inset;
    border:1px solid #00000022;
  }

  .letterhead{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:26px 30px 20px;border-bottom:2px solid var(--ink);
    flex-wrap:wrap;gap:16px;
  }
  .logo-img{
    height:52px;width:auto;display:block;
  }
  .doc-meta{text-align:right;}
  .doc-meta .doc-title{font-size:13px;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;}
  .doc-meta input[type=date]{
    font-family:Arial, sans-serif;font-size:15px;color:var(--ink);
    background:transparent;border:none;border-bottom:1px solid var(--ink);
    padding:2px 0;text-align:right;width:150px;
  }

  .section{padding:22px 30px;border-bottom:1px solid var(--line);}
  .section:last-of-type{border-bottom:none;}
  .section h2{
    font-size:12px;letter-spacing:.08em;text-transform:none;
    color:var(--red-dark);margin:0 0 14px;font-weight:600;
  }

  .field-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media(max-width:560px){.field-row{grid-template-columns:1fr;}}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;}
  .field input[type=text]{
    width:100%;border:none;border-bottom:1px solid var(--ink);
    background:transparent;font-family:Arial, sans-serif;font-size:15px;
    padding:4px 2px;color:var(--ink);
  }
  .field input:focus{outline:none;border-bottom:2px solid var(--red);}
  .field select{
    width:100%;border:none;border-bottom:1px solid var(--ink);
    background:transparent;font-family:Arial, sans-serif;font-size:15px;
    padding:5px 2px;color:var(--ink);
  }
  .field select:focus{outline:none;border-bottom:2px solid var(--red);}
  .field .dest-otro{
    width:100%;border:none;border-bottom:1px solid var(--ink);
    background:transparent;font-family:Arial, sans-serif;font-size:14px;
    padding:4px 2px;color:var(--ink);
  }

  table.items{width:100%;border-collapse:collapse;margin-top:4px;}
  table.items th{
    text-align:left;font-size:11px;color:var(--muted);font-weight:600;
    border-bottom:1px solid var(--ink);padding:6px 8px;letter-spacing:.03em;
  }
  table.items td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.items input{
    width:100%;border:none;background:transparent;
    font-family:Arial, sans-serif;font-size:13.5px;color:var(--ink);
    padding:6px 2px;
  }
  table.items input:focus{outline:none;background:#fff;}
  table.items td.desc input{font-family:Arial, sans-serif;font-size:14px;}
  td.qty{width:70px;}
  td.serial{width:150px;}
  td.rm{width:34px;text-align:center;}
  .rm-btn{
    border:none;background:none;color:#b8b1a0;cursor:pointer;font-size:16px;
    line-height:1;padding:2px 6px;
  }
  .rm-btn:hover{color:var(--err);}
  .add-row-btn{
    margin-top:12px;background:none;border:1px dashed var(--muted);color:var(--ink);
    font-family:Arial, sans-serif;font-size:12px;padding:8px 14px;
    cursor:pointer;border-radius:2px;
  }
  .add-row-btn:hover{border-color:var(--red);color:var(--red-dark);}

  .signers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
  @media(max-width:640px){.signers{grid-template-columns:1fr;}}
  .signer-block{border:1px solid var(--line);padding:12px;background:#fff;}
  .signer-block h3{
    font-size:11px;letter-spacing:.05em;color:var(--muted);margin:0 0 8px;font-weight:600;
  }
  .sig-canvas-wrap{
    position:relative;border:1px dashed #c8c1ae;background:
      repeating-linear-gradient(0deg,transparent,transparent 100%);
    touch-action:none;
  }
  .sig-canvas-wrap canvas{width:100%;height:110px;display:block;cursor:crosshair;}
  .sig-placeholder{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#c3bda9;pointer-events:none;font-family:Arial, sans-serif;
  }
  .sig-tools{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .clear-sig{
    background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;
    text-decoration:underline;padding:0;font-family:Arial, sans-serif;
  }
  .sig-status{font-size:10px;font-family:Arial, sans-serif;}
  .sig-status.ok{color:var(--green);}
  .sig-status.pending{color:var(--muted);}
  .signer-block input[type=text]{
    width:100%;border:none;border-top:1px solid var(--ink);margin-top:10px;
    padding-top:6px;font-family:Arial, sans-serif;font-size:13px;
    background:transparent;
  }
  .signer-block input:focus{outline:none;}
  .signer-block .cap{font-size:9.5px;color:var(--muted);margin-top:3px;}
  .signer-block .sig-cap{margin:0 0 4px;text-transform:none;}
  .signer-block .acl-label{
    display:block;font-size:10.5px;color:var(--muted);margin-top:12px;letter-spacing:.03em;
  }
  .signer-block input[type=text]{margin-top:4px;}

  .footer-actions{padding:24px 30px 30px;}
  .submit-btn{
    width:100%;background:var(--red);color:#fff;border:none;
    font-family:Arial, sans-serif;font-weight:600;font-size:16px;
    padding:15px;cursor:pointer;letter-spacing:.01em;
  }
  .submit-btn:hover{background:var(--red-dark);}
  .submit-btn:disabled{background:#c9c2b3;cursor:not-allowed;}
  .error-msg{color:var(--err);font-size:12.5px;margin-top:10px;font-family:Arial, sans-serif;}

  /* success */
  .success-sheet{padding:60px 30px;text-align:center;}
  .success-sheet .stamp{
    display:inline-block;border:2px solid var(--green);color:var(--green);
    font-family:Arial, sans-serif;font-size:13px;letter-spacing:.08em;
    padding:8px 18px;transform:rotate(-3deg);margin-bottom:22px;
  }
  .success-sheet h2{font-size:22px;margin:0 0 10px;}
  .success-sheet p{color:var(--muted);font-size:14px;margin:0 0 4px;}
  .success-sheet .rid{font-family:Arial, sans-serif;font-size:13px;color:var(--ink);margin-bottom:26px;}
  .new-btn{
    background:var(--ink);color:#fff;border:none;padding:12px 24px;
    font-family:Arial, sans-serif;font-weight:600;cursor:pointer;font-size:14px;
  }

  /* admin */
  .admin-sheet{padding:36px 30px;}
  .admin-sheet h2{font-size:18px;margin:0 0 4px;}
  .admin-sheet .sub{color:var(--muted);font-size:12.5px;margin:0 0 22px;}
  .admin-login input{
    width:100%;border:1px solid var(--line);padding:12px;font-family:Arial, sans-serif;
    font-size:14px;margin-bottom:12px;background:#fff;
  }
  .admin-login button, .admin-panel .primary-btn{
    background:var(--ink);color:#fff;border:none;padding:12px 20px;
    font-family:Arial, sans-serif;font-weight:600;cursor:pointer;font-size:14px;
  }
  .back-link{
    background:none;border:none;color:var(--muted);font-family:Arial, sans-serif;
    font-size:12px;cursor:pointer;text-decoration:underline;margin-bottom:18px;padding:0;
  }
  .admin-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  table.admin-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.admin-table th{
    text-align:left;border-bottom:1px solid var(--ink);padding:8px 6px;
    color:var(--muted);font-weight:600;font-size:10.5px;letter-spacing:.03em;
  }
  table.admin-table td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top;}
  .badge{font-family:Arial, sans-serif;font-size:10px;padding:2px 6px;border:1px solid;}
  .badge.ok{color:var(--green);border-color:var(--green);}
  .badge.no{color:var(--err);border-color:var(--err);}
  .del-btn{background:none;border:none;color:#b8b1a0;cursor:pointer;font-size:11px;text-decoration:underline;}
  .del-btn:hover{color:var(--err);}
  .empty-state{color:var(--muted);font-size:13px;padding:20px 0;text-align:center;}
  .note{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.5;}
  .pw-change-box{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);}
  .pw-change-box input{
    width:100%;border:1px solid var(--line);padding:10px;font-family:Arial, sans-serif;
    font-size:13px;margin-bottom:10px;background:#fff;
  }
  .pw-change-box #savePwBtn{
    background:var(--ink);color:#fff;border:none;padding:10px 18px;
    font-family:Arial, sans-serif;font-weight:600;cursor:pointer;font-size:13px;
  }
  .open-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap;
  }
  .open-row:hover{background:#f3efe6;}
  .open-row-id{font-family:Arial, sans-serif;font-size:12px;color:var(--muted);}
  .open-row-sub{font-size:14.5px;margin-top:2px;}
  .open-row-badges{display:flex;gap:6px;flex-wrap:wrap;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <span class="tag">FERNIPLAST · LOGÍSTICA INTERNA</span>
    <div style="display:flex;gap:16px;align-items:center;">
      <button class="admin-link" id="openListLinkBtn">Remitos abiertos</button>
      <button class="admin-link" id="adminLinkBtn">Acceso administrador</button>
    </div>
  </div>
  <div id="app"></div>
</div>

async function getAdminPassword(){
  try{
    const res = await window.storage.get('admin-config:password', true);
    if(res && res.value) return res.value;
  }catch(e){ /* no hay clave guardada todavía, se usa la default */ }
  return DEFAULT_ADMIN_PASSWORD;
}

  return await window.storage.set('admin-config:password', newPw, true);

class SignaturePad{
  constructor(canvas){
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.drawing = false;
    this.hasInk = false;
    this.resize();
    window.addEventListener('resize', () => this.resize());
    canvas.addEventListener('pointerdown', e => this.start(e));
    canvas.addEventListener('pointermove', e => this.move(e));
    window.addEventListener('pointerup', () => this.end());
    canvas.addEventListener('pointerleave', () => {});
  }
  resize(){
    const rect = this.canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const prevData = this.hasInk ? this.canvas.toDataURL() : null;
    this.canvas.width = rect.width * dpr;
    this.canvas.height = rect.height * dpr;
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.ctx.lineWidth = 2;
    this.ctx.lineCap = 'round';
    this.ctx.strokeStyle = '#1a1a1a';
    if(prevData){
      const img = new Image();
      img.onload = () => this.ctx.drawImage(img,0,0,rect.width,rect.height);
      img.src = prevData;
    }
  }
  pos(e){
    const rect = this.canvas.getBoundingClientRect();
    return {x:e.clientX-rect.left, y:e.clientY-rect.top};
  }
  start(e){
    this.drawing = true;
    this.hasInk = true;
    const p = this.pos(e);
    this.ctx.beginPath();
    this.ctx.moveTo(p.x,p.y);
    this.canvas.setPointerCapture(e.pointerId);
    this.onchange && this.onchange();
  }
  move(e){
    if(!this.drawing) return;
    const p = this.pos(e);
    this.ctx.lineTo(p.x,p.y);
    this.ctx.stroke();
  }
  end(){ this.drawing = false; }
  clear(){
    this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    this.hasInk = false;
    this.onchange && this.onchange();
  }
  isEmpty(){ return !this.hasInk; }
  toDataURL(){ return this.canvas.toDataURL('image/png'); }
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(view === 'form') app.appendChild(renderForm());
  else if(view === 'success') app.appendChild(renderSuccess());
  else if(view === 'open-list') app.appendChild(renderOpenList());
  else if(view === 'complete-signature') app.appendChild(renderCompleteSignature());
  else if(view === 'admin-login') app.appendChild(renderAdminLogin());
  else if(view === 'admin-panel') app.appendChild(renderAdminPanel());
}

function renderForm(){
  const sheet = el(`<div class="sheet"></div>`);

  sheet.appendChild(el(`
    <div class="letterhead">
      <div><img class="logo-img" src="${LOGO_DATA_URI}" alt="Ferniplast"></div>
      <div class="doc-meta">
        <div class="doc-title">REMITO DE TRANSPORTE INTERNO</div>
      </div>
    </div>
  `));
  const dateWrap = sheet.querySelector('.doc-meta');
  const dateInput = el(`<input type="date">`);
  dateInput.value = header.fecha;
  dateInput.addEventListener('change', e => header.fecha = e.target.value);
  dateWrap.appendChild(dateInput);

  // header fields
  const headSec = el(`<div class="section"><h2>Datos generales</h2></div>`);
  const fr = el(`<div class="field-row"></div>`);
  [['remitente','Remitente'],['transporta','Transporta']].forEach(([key,label])=>{
    const f = el(`<div class="field"><label>${label}</label><input type="text" placeholder="Nombre / sector"></div>`);
    const input = f.querySelector('input');
    input.value = header[key];
    input.addEventListener('input', e => header[key] = e.target.value);
    fr.appendChild(f);
  });

  // destinatario: lista desplegable + "Otro"
  const destField = el(`
    <div class="field">
      <label>Destinatario</label>
      <select class="dest-select">
        <option value="">Seleccionar...</option>
        ${DESTINATARIO_OPTIONS.map(o => `<option value="${o}">${o}</option>`).join('')}
        <option value="Otro">Otro</option>
      </select>
      <input type="text" class="dest-otro" placeholder="Escribir destinatario" style="display:none;margin-top:8px;">
    </div>
  `);
  const destSelect = destField.querySelector('.dest-select');
  const destOtro = destField.querySelector('.dest-otro');
  destSelect.value = header.destinatario && DESTINATARIO_OPTIONS.includes(header.destinatario)
    ? header.destinatario
    : (header.destinatario === 'Otro' ? 'Otro' : '');
  if(header.destinatario === 'Otro'){
    destOtro.style.display = 'block';
    destOtro.value = header.destinatarioOtro;
  }
  destSelect.addEventListener('change', e => {
    header.destinatario = e.target.value;
    destOtro.style.display = e.target.value === 'Otro' ? 'block' : 'none';
    if(e.target.value !== 'Otro') header.destinatarioOtro = '';
  });
  destOtro.addEventListener('input', e => header.destinatarioOtro = e.target.value);
  fr.appendChild(destField);

  headSec.appendChild(fr);
  sheet.appendChild(headSec);

  // items table
  const itemSec = el(`<div class="section"><h2>Mercadería a transportar</h2></div>`);
  const table = el(`
    <table class="items">
      <thead><tr><th style="width:70px">Cantidad</th><th style="width:150px">N° Serial</th><th>Descripción</th><th style="width:34px"></th></tr></thead>
      <tbody></tbody>
    </table>
  `);
  const tbody = table.querySelector('tbody');
  itemRows.forEach((row, idx) => {
    const tr = el(`
      <tr>
        <td class="qty"><input type="text" inputmode="numeric" placeholder="0"></td>
        <td class="serial"><input type="text" placeholder="—"></td>
        <td class="desc"><input type="text" placeholder="Descripción del artículo"></td>
        <td class="rm"><button class="rm-btn" title="Quitar línea">✕</button></td>
      </tr>
    `);
    const [qtyIn, serIn, descIn] = tr.querySelectorAll('input');
    qtyIn.value = row.cantidad; serIn.value = row.serial; descIn.value = row.descripcion;
    qtyIn.addEventListener('input', e => itemRows[idx].cantidad = e.target.value);
    serIn.addEventListener('input', e => itemRows[idx].serial = e.target.value);
    descIn.addEventListener('input', e => itemRows[idx].descripcion = e.target.value);
    tr.querySelector('.rm-btn').addEventListener('click', () => {
      itemRows.splice(idx,1);
      render();
    });
    tbody.appendChild(tr);
  });
  itemSec.appendChild(table);
  const addBtn = el(`<button class="add-row-btn">+ Agregar línea</button>`);
  addBtn.addEventListener('click', () => {
    itemRows.push({cantidad:'',serial:'',descripcion:''});
    render();
  });
  itemSec.appendChild(addBtn);
  sheet.appendChild(itemSec);

  // signatures
  const sigSec = el(`<div class="section"><h2>Firmas</h2><p class="cap" style="margin:-8px 0 14px;">La firma de Remitente es obligatoria para guardar. Transporta y Receptor pueden completarse más tarde desde "Remitos abiertos".</p></div>`);
  const signersGrid = el(`<div class="signers"></div>`);
  [['remitente','Remitente',true],['transporta','Transporta',false],['receptor','Receptor',false]].forEach(([key,label,required])=>{
    const block = el(`
      <div class="signer-block">
        <h3>${label}${required ? '' : ' <span style="color:var(--muted);font-weight:400;">(opcional ahora)</span>'}</h3>
        <div class="cap sig-cap">Firma</div>
        <div class="sig-canvas-wrap">
          <canvas></canvas>
          <div class="sig-placeholder">firmar aquí</div>
        </div>
        <div class="sig-tools">
          <button class="clear-sig">Limpiar</button>
          <span class="sig-status pending">sin firma</span>
        </div>
        <label class="acl-label">Aclaración</label>
        <input type="text" placeholder="Nombre y apellido">
      </div>
    `);
    const canvas = block.querySelector('canvas');
    const placeholder = block.querySelector('.sig-placeholder');
    const status = block.querySelector('.sig-status');
    const pad = new SignaturePad(canvas);
    pad.onchange = () => {
      if(pad.isEmpty()){
        placeholder.style.display = 'flex';
        status.textContent = 'sin firma'; status.className = 'sig-status pending';
      } else {
        placeholder.style.display = 'none';
        status.textContent = 'firmado'; status.className = 'sig-status ok';
      }
    };
    pads[key] = pad;
    block.querySelector('.clear-sig').addEventListener('click', () => pad.clear());
    const aclInput = block.querySelector('input[type=text]');
    aclInput.value = signers[key].aclaracion;
    aclInput.addEventListener('input', e => signers[key].aclaracion = e.target.value);
    signersGrid.appendChild(block);
  });
  sigSec.appendChild(signersGrid);
  sheet.appendChild(sigSec);

  // footer
  const footer = el(`<div class="footer-actions"></div>`);
  const btn = el(`<button class="submit-btn">Guardar remito</button>`);
  btn.addEventListener('click', () => handleSubmit());
  footer.appendChild(btn);
  if(formError){
    footer.appendChild(el(`<div class="error-msg">${formError}</div>`));
  }
  sheet.appendChild(footer);

  return sheet;
}

function getDestinatarioValue(){
  if(header.destinatario === 'Otro') return header.destinatarioOtro.trim();
  return header.destinatario.trim();
}

async function handleSubmit(){
  formError = '';
  const destinatarioFinal = getDestinatarioValue();
  if(!header.fecha || !header.remitente.trim() || !header.transporta.trim() || !destinatarioFinal){
    formError = header.destinatario === 'Otro' && !header.destinatarioOtro.trim()
      ? 'Escribí el nombre del destinatario en el campo "Otro".'
      : 'Completá fecha, remitente, transporta y destinatario.';
    render(); return;
  }
  const validItems = itemRows.filter(r => r.cantidad.trim() && r.descripcion.trim());
  if(validItems.length === 0){
    formError = 'Agregá al menos un artículo con cantidad y descripción.';
    render(); return;
  }
  // Remitente es obligatorio. Transporta y Receptor son opcionales, pero si se
  // empezó a completar uno (firma o aclaración) hay que completar el otro también.
  if(pads.remitente.isEmpty() || !signers.remitente.aclaracion.trim()){
    formError = 'Falta la firma o la aclaración de Remitente.';
    render(); return;
  }
  for(const [key,label] of [['transporta','Transporta'],['receptor','Receptor']]){
    const hasFirma = !pads[key].isEmpty();
    const hasAcl = !!signers[key].aclaracion.trim();
    if(hasFirma !== hasAcl){
      formError = `Completá firma y aclaración de ${label}, o dejá ambas vacías para completarlas después.`;
      render(); return;
    }
  }

  const firmas = {
    remitente: {firma: pads.remitente.toDataURL(), aclaracion: signers.remitente.aclaracion.trim()},
    transporta: (!pads.transporta.isEmpty() && signers.transporta.aclaracion.trim())
      ? {firma: pads.transporta.toDataURL(), aclaracion: signers.transporta.aclaracion.trim()} : null,
    receptor: (!pads.receptor.isEmpty() && signers.receptor.aclaracion.trim())
      ? {firma: pads.receptor.toDataURL(), aclaracion: signers.receptor.aclaracion.trim()} : null
  };

  const id = 'REM-' + Date.now().toString(36).toUpperCase();
  const data = {
    id,
    fecha: header.fecha,
    remitente: header.remitente.trim(),
    transporta: header.transporta.trim(),
    destinatario: destinatarioFinal,
    items: validItems,
    firmas,
    createdAt: new Date().toISOString()
  };

  try{
    const res = await window.storage.set('submissions:'+id, JSON.stringify(data), true);
    if(!res){ formError = 'No se pudo guardar el remito. Probá de nuevo.'; render(); return; }
  }catch(err){
    console.error(err);
    formError = 'Error de almacenamiento. Probá de nuevo.';
    render(); return;
  }

  submittedId = id;
  submittedStillOpen = !(firmas.transporta && firmas.receptor);
  view = 'success';
  resetForm();
  render();
}

function resetForm(){
  itemRows = Array.from({length:5}, () => ({cantidad:'', serial:'', descripcion:''}));
  header = {fecha:'', remitente:'', transporta:'', destinatario:'', destinatarioOtro:''};
  signers = {remitente:{aclaracion:''}, transporta:{aclaracion:''}, receptor:{aclaracion:''}};
  pads = {};
  formError = '';
}

function renderSuccess(){
  const sheet = el(`
    <div class="sheet success-sheet">
      <div class="stamp">${submittedStillOpen ? '⏳ PENDIENTE' : '✓ REGISTRADO'}</div>
      <h2>${submittedStillOpen ? 'Remito guardado, falta completar firmas' : 'Remito guardado'}</h2>
      <p>${submittedStillOpen
        ? 'Queda en "Remitos abiertos" hasta que Transporta y Receptor firmen.'
        : 'El comprobante quedó registrado con firmas de las tres partes.'}</p>
      <div class="rid">N° ${submittedId}</div>
    </div>
  `);
  const btnRow = el(`<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;"></div>`);
  const btn = el(`<button class="new-btn">Cargar otro remito</button>`);
  btn.addEventListener('click', () => { view = 'form'; render(); });
  btnRow.appendChild(btn);
  if(submittedStillOpen){
    const btn2 = el(`<button class="new-btn" style="background:var(--red);">Ver remitos abiertos</button>`);
    btn2.addEventListener('click', () => { view = 'open-list'; render(); loadOpenSubmissions(); });
    btnRow.appendChild(btn2);
  }
  sheet.appendChild(btnRow);
  return sheet;
}

function isSubOpen(sub){
  return !(sub.firmas && sub.firmas.transporta && sub.firmas.receptor);
}

function missingSigners(sub){
  const missing = [];
  if(!sub.firmas || !sub.firmas.transporta) missing.push('Transporta');
  if(!sub.firmas || !sub.firmas.receptor) missing.push('Receptor');
  return missing;
}

async function loadOpenSubmissions(){
  loadingOpen = true;
  render();
  try{
    const listRes = await window.storage.list('submissions:', true);
    const keys = (listRes && listRes.keys) ? listRes.keys : [];
    const results = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value){
          const sub = JSON.parse(r.value);
          if(isSubOpen(sub)) results.push(sub);
        }
      }catch(e){ /* skip unreadable entry */ }
    }
    results.sort((a,b) => (a.createdAt||'').localeCompare(b.createdAt||''));
    openSubmissions = results;
  }catch(err){
    console.error(err);
    openSubmissions = [];
  }
  loadingOpen = false;
  render();
}

function renderOpenList(){
  const sheet = el(`
    <div class="sheet admin-sheet">
      <button class="back-link" id="backBtn">← Volver al formulario</button>
      <h2>Remitos abiertos</h2>
      <p class="sub">Remitos que todavía necesitan la firma de Transporta y/o Receptor.</p>
      <div id="openHolder"></div>
    </div>
  `);
  sheet.querySelector('#backBtn').addEventListener('click', () => { view='form'; render(); });

  const holder = sheet.querySelector('#openHolder');

    holder.appendChild(el(`<div class="empty-state">Cargando remitos abiertos…</div>`));
  } else if(openSubmissions.length === 0){
    holder.appendChild(el(`<div class="empty-state">No hay remitos pendientes de firma. 🎉</div>`));
  } else {
    openSubmissions.forEach(sub => {
      const missing = missingSigners(sub);
      const row = el(`
        <div class="open-row">
          <div class="open-row-main">
            <div class="open-row-id">${sub.id} · ${sub.fecha||'—'}</div>
            <div class="open-row-sub">${sub.remitente||'—'} → ${sub.destinatario||'—'}</div>
          </div>
          <div class="open-row-badges">

          </div>
        </div>
      `);
      row.addEventListener('click', () => {
        activeOpenId = sub.id;
        activeOpenSub = null;
        completePads = {};
        completeAclaraciones = {transporta:'', receptor:''};
        completeError = '';
        view = 'complete-signature';
        render();
        loadOneSubmission(sub.id);
      });
      holder.appendChild(row);
    });
  }
  return sheet;
}

async function loadOneSubmission(id){
  try{
    const r = await window.storage.get('submissions:'+id, true);
    if(r && r.value) activeOpenSub = JSON.parse(r.value);
  }catch(e){
    console.error(e);
  }
  render();
}

function renderCompleteSignature(){
  const sheet = el(`<div class="sheet"></div>`);
  const back = el(`<div class="section" style="border-bottom:none;padding-bottom:0;"><button class="back-link" id="backBtn">← Volver a remitos abiertos</button></div>`);
  sheet.appendChild(back);

  backBtn.addEventListener('click', () => { view='open-list'; render(); loadOpenSubmissions(); });

  if(!activeOpenSub){
    sheet.appendChild(el(`<div class="empty-state">Cargando remito…</div>`));

  }

  const sub = activeOpenSub;
  const infoSec = el(`
    <div class="section">
      <h2>Datos del remito ${sub.id}</h2>
      <p class="sub" style="margin:0 0 4px;"><strong>Fecha:</strong> ${sub.fecha||'—'}</p>
      <p class="sub" style="margin:0 0 4px;"><strong>Remitente:</strong> ${sub.remitente||'—'}</p>

    </div>

  const itemsSec = el(`<div class="section"><h2>Mercadería</h2></div>`);
  const table = el(`
    <table class="items">
      <thead><tr><th style="width:70px">Cantidad</th><th style="width:150px">N° Serial</th><th>Descripción</th></tr></thead>
      <tbody></tbody>

  `);

    `));

  sheet.appendChild(itemsSec);

  const sigSec = el(`<div class="section"><h2>Firmas</h2></div>`);
  const signersGrid = el(`<div class="signers"></div>`);

  // Remitente: siempre ya firmado en este punto
  const remBlock = el(`
    <div class="signer-block" style="opacity:.85;">
      <h3>Remitente</h3>
      <div class="cap sig-cap">Firma</div>
      <div class="sig-canvas-wrap" style="background:#fff;"><img src="${sub.firmas.remitente.firma}" style="width:100%;height:110px;object-fit:contain;"></div>
      <div class="sig-tools"><span class="sig-status ok">firmado</span></div>

    </div>
  `);
  signersGrid.appendChild(remBlock);

  ['transporta','receptor'].forEach(key => {
    const label = key === 'transporta' ? 'Transporta' : 'Receptor';
    if(sub.firmas && sub.firmas[key]){
      const doneBlock = el(`
        <div class="signer-block" style="opacity:.85;">
          <h3>${label}</h3>
          <div class="cap sig-cap">Firma</div>
          <div class="sig-canvas-wrap" style="background:#fff;"><img src="${sub.firmas[key].firma}" style="width:100%;height:110px;object-fit:contain;"></div>
          <div class="sig-tools"><span class="sig-status ok">firmado</span></div>
          <div class="cap" style="margin-top:10px;">Aclaración: <strong>${sub.firmas[key].aclaracion}</strong></div>
        </div>
      `);
      signersGrid.appendChild(doneBlock);
    } else {
      const block = el(`
        <div class="signer-block">
          <h3>${label} <span style="color:var(--red-dark);font-weight:400;">(pendiente)</span></h3>
          <div class="cap sig-cap">Firma</div>
          <div class="sig-canvas-wrap">
            <canvas></canvas>
            <div class="sig-placeholder">firmar aquí</div>
          </div>
          <div class="sig-tools">
            <button class="clear-sig">Limpiar</button>

          </div>

          placeholder.style.display = 'none';

async function handleCompleteSignature(){
  completeError = '';
  const sub = activeOpenSub;
  const pendingKeys = Object.keys(completePads);
  if(pendingKeys.length === 0){ return; }

  const toSave = {};
  let anyFilled = false;
  for(const key of pendingKeys){
    const pad = completePads[key];
    const acl = (completeAclaraciones[key] || '').trim();
    const hasFirma = !pad.isEmpty();
    if(hasFirma !== !!acl){
      completeError = `Completá firma y aclaración, o dejá ambas vacías.`;
      render(); return;
    }
    if(hasFirma && acl){
      toSave[key] = {firma: pad.toDataURL(), aclaracion: acl};
      anyFilled = true;
    }
  }
  if(!anyFilled){
    completeError = 'Firmá al menos uno de los campos pendientes antes de guardar.';
    render(); return;
  }

  const updated = {
    ...sub,
    firmas: {...sub.firmas, ...toSave}
  };

  try{
    const res = await window.storage.set('submissions:'+sub.id, JSON.stringify(updated), true);
    if(!res){ completeError = 'No se pudo guardar. Probá de nuevo.'; render(); return; }
  }catch(err){
    console.error(err);
    completeError = 'Error de almacenamiento. Probá de nuevo.';
    render(); return;
  }

  submittedId = sub.id;
  submittedStillOpen = isSubOpen(updated);
  activeOpenId = null; activeOpenSub = null; completePads = {}; completeAclaraciones = {};
  view = 'success';
  render();
}

function renderAdminLogin(){
  const sheet = el(`
    <div class="sheet admin-sheet">  <button class="back-link" id="backBtn">← Volver al formulario</button>
      <h2>Panel de administración</h2>
      <p class="sub">Acceso restringido. Solo el administrador puede exportar el resumen en Excel.</p>

        <input type="password" id="pwInput" placeholder="Contraseña de administrador">
        <button id="loginBtn">Ingresar</button>
        ${adminError ? `<div class="error-msg">${adminError}</div>` : ''}
      </div>
    </div>
  `);
  sheet.querySelector('#backBtn').addEventListener('click', () => { view='form'; render(); });
  const pwInput = sheet.querySelector('#pwInput');
  const loginBtn = sheet.querySelector('#loginBtn');
  const doLogin = async () => {
    loginBtn.disabled = true;
    const stored = await getAdminPassword();
    loginBtn.disabled = false;
    if(pwInput.value === stored){
      adminAuthed = true; adminError=''; view='admin-panel';
      render();
      loadSubmissions();
    } else {
      adminError = 'Contraseña incorrecta.';
      render();
    }
  };
  loginBtn.addEventListener('click', doLogin);
  pwInput.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  return sheet;
}

async function loadSubmissions(){
  loadingSubs = true;
  render();
  try{
    const listRes = await window.storage.list('submissions:', true);
    const keys = (listRes && listRes.keys) ? listRes.keys : [];
    const results = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) results.push(JSON.parse(r.value));
      }catch(e){ /* skip unreadable entry */ }
    }
    results.sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
    submissions = results;
  }catch(err){
    console.error(err);
    submissions = [];
  }
  loadingSubs = false;
  render();
}

function renderAdminPanel(){
  const sheet = el(`
    <div class="sheet admin-sheet">
      <button class="back-link" id="backBtn">← Volver al formulario</button>
      <h2>Remitos registrados</h2>
      <p class="sub">Visible solo para el administrador. Los datos se comparten entre todos los usuarios de esta app.</p>
      <div class="admin-toolbar">
        <span class="sub" style="margin:0">${submissions.length} remito(s) · ${submissions.filter(isSubOpen).length} abierto(s)</span>
        <button class="primary-btn" id="exportBtn">Descargar Excel</button>
      </div>
      <div id="tableHolder"></div>
      <div class="pw-change-box">
        <button class="back-link" id="togglePwBtn" style="margin:0">Cambiar contraseña de administrador ▾</button>
        <div id="pwForm" style="display:none;margin-top:12px;">
          <input type="password" id="curPw" placeholder="Contraseña actual">
          <input type="password" id="newPw" placeholder="Nueva contraseña">
          <input type="password" id="newPw2" placeholder="Repetir nueva contraseña">
          <button id="savePwBtn">Guardar nueva contraseña</button>
          <div id="pwMsg" class="note" style="margin-top:8px;"></div>
        </div>
      </div>
    </div>
  `);
  sheet.querySelector('#backBtn').addEventListener('click', () => { view='form'; render(); });
  sheet.querySelector('#exportBtn').addEventListener('click', exportExcel);

  const toggleBtn = sheet.querySelector('#togglePwBtn');
  const pwForm = sheet.querySelector('#pwForm');
  toggleBtn.addEventListener('click', () => {
    pwForm.style.display = pwForm.style.display === 'none' ? 'block' : 'none';
  });
  sheet.querySelector('#savePwBtn').addEventListener('click', async () => {
    const cur = sheet.querySelector('#curPw').value;
    const n1 = sheet.querySelector('#newPw').value;
    const n2 = sheet.querySelector('#newPw2').value;
    const msg = sheet.querySelector('#pwMsg');
    const stored = await getAdminPassword();
    if(cur !== stored){ msg.textContent = 'La contraseña actual no coincide.'; msg.style.color = 'var(--err)'; return; }
    if(!n1 || n1.length < 6){ msg.textContent = 'La nueva contraseña debe tener al menos 6 caracteres.'; msg.style.color='var(--err)'; return; }
    if(n1 !== n2){ msg.textContent = 'Las contraseñas nuevas no coinciden.'; msg.style.color='var(--err)'; return; }
    const res = await setAdminPassword(n1);
    if(res){ msg.textContent = 'Contraseña actualizada correctamente.'; msg.style.color='var(--green)'; }
    else { msg.textContent = 'No se pudo guardar. Probá de nuevo.'; msg.style.color='var(--err)'; }
  });

  const holder = sheet.querySelector('#tableHolder');
  if(loadingSubs){
    holder.appendChild(el(`<div class="empty-state">Cargando remitos…</div>`));
  } else if(submissions.length === 0){
    holder.appendChild(el(`<div class="empty-state">Todavía no hay remitos cargados.</div>`));
  } else {
    const table = el(`
      <table class="admin-table">
        <thead><tr>
          <th>Fecha</th><th>N°</th><th>Remitente</th><th>Transporta</th><th>Destinatario</th>
          <th>Ítems</th><th>Firmas</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    `);
    const tbody = table.querySelector('tbody');
    submissions.forEach(sub => {
      const isOpen = isSubOpen(sub);
      const tr = el(`
        <tr>
          <td>${sub.fecha||'—'}</td>
          <td>${sub.id}</td>
          <td>${sub.remitente||'—'}</td>
          <td>${sub.transporta||'—'}</td>
          <td>${sub.destinatario||'—'}</td>
          <td>${(sub.items||[]).length}</td>
          <td><span class="badge ${isOpen?'no':'ok'}">${isOpen?'abierto':'cerrado'}</span></td>
          <td></td>
        </tr>
      `);
      const delBtn = el(`<button class="del-btn">Eliminar</button>`);
      delBtn.addEventListener('click', async () => {
        if(!confirm('¿Eliminar este remito? Esta acción no se puede deshacer.')) return;
        await window.storage.delete('submissions:'+sub.id, true);
        loadSubmissions();
      });
      tr.lastElementChild.appendChild(delBtn);
      tbody.appendChild(tr);
    });
    holder.appendChild(table);
  }
  return sheet;
}

function exportExcel(){
  if(submissions.length === 0){ alert('No hay remitos para exportar.'); return; }

  const summaryRows = submissions.map(s => ({
    'N° Remito': s.id,
    'Estado': isSubOpen(s) ? 'Abierto' : 'Cerrado',
    'Fecha': s.fecha,
    'Remitente': s.remitente,
    'Transporta': s.transporta,
    'Destinatario': s.destinatario,
    'Cant. Ítems': (s.items||[]).length,
    'Firmó Remitente': s.firmas?.remitente?.aclaracion || '',
    'Firmó Transporta': s.firmas?.transporta?.aclaracion || '',
    'Firmó Receptor': s.firmas?.receptor?.aclaracion || '',
    'Registrado (UTC)': s.createdAt
  }));

  const detailRows = [];
  submissions.forEach(s => {
    (s.items||[]).forEach(it => {
      detailRows.push({
        'N° Remito': s.id,
        'Fecha': s.fecha,
        'Cantidad': it.cantidad,
        'N° Serial': it.serial,
        'Descripción': it.descripcion
      });
    });
  });

  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.json_to_sheet(summaryRows);
  const ws2 = XLSX.utils.json_to_sheet(detailRows);
  XLSX.utils.book_append_sheet(wb, ws1, 'Remitos');
  XLSX.utils.book_append_sheet(wb, ws2, 'Detalle de items');
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `remitos-ferniplast-${stamp}.xlsx`);
}

document.getElementById('openListLinkBtn').addEventListener('click', () => {
  view = 'open-list';
  render();
  loadOpenSubmissions();
});

document.getElementById('adminLinkBtn').addEventListener('click', () => {
  view = adminAuthed ? 'admin-panel' : 'admin-login';
  render();
  if(adminAuthed) loadSubmissions();
});
